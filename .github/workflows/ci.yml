# Integração contínua: roda a cada push e a cada Pull Request.
# Se algo falhar, o PR fica vermelho e você não faz merge. Detalhes: docs/QA.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run test:e2e
      - name: Guardar relatório de testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: artifacts/auto-qa/
          retention-days: 7
